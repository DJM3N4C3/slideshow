<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slideshow</title>
<style>
  :root { --fade: 800ms; --fit: contain; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #stage { position: fixed; inset: 0; }
  #stage img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: var(--fit);
    opacity: 0;
    transition: opacity var(--fade) ease-in-out;
    user-select: none;
    -webkit-user-drag: none;
  }
  #stage img.active { opacity: 1; }

  #msg {
    position: fixed; inset: 0;
    display: none; place-items: center;
    padding: 2rem; text-align: center;
    color: #bbb; line-height: 1.7;
  }
  #msg code { background: #1c1c1c; padding: 2px 6px; border-radius: 5px; }
</style>
</head>
<body>

<div id="stage"></div>
<div id="msg"></div>

<script type="module">
const stage = document.getElementById('stage');
const msg   = document.getElementById('msg');

function fail(html) {
  msg.innerHTML = html;
  msg.style.display = 'grid';
}

async function loadJSON(url, fallback) {
  try {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) return fallback;
    return await res.json();
  } catch { return fallback; }
}

/* ------------------------------------------------------------------ *
 * Configuration
 * ------------------------------------------------------------------ */
const cfg = Object.assign({
  duration: 5,        // seconds per image (global)
  transition: 800,    // crossfade ms
  fit: 'contain',     // 'contain' or 'cover'
  syncEpoch: 0,       // global sync anchor (ms since Unix epoch)
  imageFolder: 'images'
}, await loadJSON('config.json', {}));

const q = new URLSearchParams(location.search);
if (q.has('t'))     cfg.duration  = parseFloat(q.get('t'));
if (q.has('fit'))   cfg.fit       = q.get('fit');
if (q.has('epoch')) cfg.syncEpoch = parseInt(q.get('epoch'), 10);

if (!Number.isFinite(cfg.duration) || cfg.duration <= 0) cfg.duration = 5;
cfg.fit = cfg.fit === 'cover' ? 'cover' : 'contain';
if (!Number.isFinite(cfg.syncEpoch)) cfg.syncEpoch = 0;

document.documentElement.style.setProperty('--fade', `${cfg.transition}ms`);
document.documentElement.style.setProperty('--fit', cfg.fit);

/* ------------------------------------------------------------------ *
 * Auto-detect GitHub owner/repo from the page URL
 * (works for username.github.io/repo and username.github.io)
 * Set REPO_OVERRIDE if you use a custom domain.
 * ------------------------------------------------------------------ */
const REPO_OVERRIDE = null; // e.g. { owner: "me", repo: "slideshow", branch: "main" }

function detectRepo() {
  const host = location.hostname;
  if (!host.endsWith('.github.io')) return null;
  const owner = host.replace(/\.github\.io$/i, '');
  const parts = location.pathname.split('/').filter(Boolean);
  const repo  = parts[0] || `${owner}.github.io`;
  return { owner, repo, branch: null };
}

/* ------------------------------------------------------------------ *
 * Fetch list of images in the folder
 * ------------------------------------------------------------------ */
async function fetchFromGitHub({ owner, repo, branch }) {
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/${cfg.imageFolder}` +
              (branch ? `?ref=${encodeURIComponent(branch)}` : '');
  const res = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
  if (!res.ok) throw new Error(`GitHub API ${res.status}`);
  const data = await res.json();
  if (!Array.isArray(data)) throw new Error('Unexpected API response');
  return data
    .filter(f => f.type === 'file' && /\.(jpe?g|png|gif)$/i.test(f.name))
    .map(f => f.path)
    .sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
}

async function getImageList() {
  const cached = sessionStorage.getItem('slideshow.images');
  if (cached) {
    try {
      const parsed = JSON.parse(cached);
      if (Array.isArray(parsed) && parsed.length) return parsed;
    } catch {}
  }

  const repoInfo = detectRepo() || REPO_OVERRIDE;
  if (repoInfo) {
    try {
      const files = await fetchFromGitHub(repoInfo);
      if (files.length) {
        sessionStorage.setItem('slideshow.images', JSON.stringify(files));
        return files;
      }
    } catch (e) {
      console.warn('GitHub auto-discovery failed:', e);
    }
  }

  // Local testing / fallback
  let fallback = await loadJSON('images.json', []);
  fallback = (Array.isArray(fallback) ? fallback : [])
    .map(x => (typeof x === 'string' ? x : x?.src))
    .filter(Boolean);
  return fallback;
}

const items = await getImageList();

if (!items.length) {
  fail('<div>No images found.<br>Put JPG / PNG / GIF files in the <code>images/</code> folder of your repo and refresh.</div>');
} else {
  start();
}

/* ------------------------------------------------------------------ *
 * Slideshow
 * ------------------------------------------------------------------ */
function start() {
  const durationMs = cfg.duration * 1000;
  const totalCycle = durationMs * items.length;

  const layers = [new Image(), new Image()];
  layers.forEach(el => { el.alt = ''; el.decoding = 'async'; stage.append(el); });
  let front = 0;

  const cache = new Map();
  function preload(src) {
    if (!cache.has(src)) { const i = new Image(); i.src = src; cache.set(src, i); }
  }

  function render(src) {
    const back = 1 - front;
    const el = layers[back];
    let done = false;
    const reveal = () => {
      if (done) return;
      done = true;
      el.classList.add('active');
      layers[front].classList.remove('active');
      front = back;
    };
    if (el.getAttribute('src') === src) el.removeAttribute('src');
    el.onload  = () => requestAnimationFrame(reveal);
    el.onerror = () => console.warn('Could not load:', src);
    el.src = src;
    if (el.complete && el.naturalWidth > 0) requestAnimationFrame(reveal);
  }

  let currentIndex = -1;
  let timeoutId    = null;

  function showIndex(index) {
    if (index === currentIndex) return;
    currentIndex = index;
    render(items[index]);
    preload(items[(index + 1) % items.length]);
  }

  function scheduleNext() {
    if (timeoutId) clearTimeout(timeoutId);

    const now     = Date.now();
    const elapsed = ((now - cfg.syncEpoch) % totalCycle + totalCycle) % totalCycle;

    const idx = Math.floor(elapsed / durationMs) % items.length;
    showIndex(idx);

    const nextBoundary = (idx + 1) * durationMs;
    let delay = nextBoundary - elapsed;
    if (delay <= 0) delay = 100;
    timeoutId = setTimeout(scheduleNext, delay);
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) scheduleNext();
  });

  scheduleNext();

  /* Fullscreen — attempt on load; if the browser blocks it, do nothing.
     The page still fills the tab and works fine without fullscreen. */
  function requestFS() {
    if (document.fullscreenElement) return;
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }
  requestFS();
}
</script>
</body>
</html>
